[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5"]
build-backend = "hatchling.build"

[project]
name = "jupyterlite-github-sync"
version = "0.1.0"
description = "JupyterLite extension to sync notebooks to GitHub via Cloudflare Worker"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "jupyterlab>=4.0.0,<5"
]

[tool.hatch.build.targets.wheel.shared-data]
"lib" = "share/jupyter/labextensions/jupyterlite-github-sync"
